name: Build and Deploy

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Needed for GitHub Releases
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'
          
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true
          
      - name: Install Dependencies
        run: flutter pub get
        
      - name: Build Web
        run: flutter build web --web-renderer html
        
      - name: Build APKs
        # Building a universal APK so the in-app updater works on all architectures
        run: flutter build apk --release --obfuscate --split-debug-info=build/app/outputs/symbols
        
      - name: Deploy Web to Firebase Hosting
        run: |
          npm install -g firebase-tools
          firebase deploy --only hosting --project ganesha-funds-tracker --token ${{ secrets.FIREBASE_TOKEN }} --non-interactive

      - name: Upload APK to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          token: ${{ secrets.FIREBASE_TOKEN }}
          # groups: testers # Uncomment this ONLY after creating a group named "testers" in Firebase Console
          file: build/app/outputs/flutter-apk/app-release.apk

      - name: Extract Version from pubspec.yaml
        id: version
        run: |
          VERSION=$(grep '^version: ' pubspec.yaml | cut -d ' ' -f 2)
          echo "tag=v$VERSION" >> $GITHUB_OUTPUT

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          body: "Automated build triggered by push to main."
          files: build/app/outputs/flutter-apk/*.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
